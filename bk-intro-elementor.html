<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>سکشن معرفی بهروز کریمی</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Vazirmatn', sans-serif;
      background-color: #fff;
    }
    .bk-section {
      background-color: #f9fafc;
      text-align: center;
      padding: 100px 20px;
    }
    .bk-avatar {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }
    .bk-title {
      color: #03308B;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .bk-description {
      color: #5F789E;
      font-size: 1.1rem;
      line-height: 1.8;
      max-width: 680px;
      margin: 0 auto;
    }
    @media (max-width: 600px) {
      .bk-title {
        font-size: 1.8rem;
      }
      .bk-description {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <section class="bk-section">
    <img class="bk-avatar" src="https://i.pravatar.cc/160?img=65" alt="بهروز کریمی" />
    <h2 class="bk-title">بهروز کریمی</h2>
    <p class="bk-description">
      مدرس و مشاور تخصصی در حوزه برندینگ، بازاریابی و توسعه فردی. با رویکردی عمیق و کاربردی، مسیر روشن کسب‌وکار را برای افراد و سازمان‌ها طراحی می‌کند. تجربه‌ی بیش از ده سال فعالیت در فضای آموزش، کوچینگ و مشاوره، از او شخصیتی ساخته که نه فقط آموزش می‌دهد، بلکه میراثی روشن خلق می‌کند.
    </p>
  </section>
</body>
</html>
